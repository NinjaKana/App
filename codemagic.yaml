workflows:
  ios-production:
    name: iOS Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile-app
    integrations:
      app_store_connect: NinjaKana
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.apprendre.japonais
      xcode: 15.4
      node: 18
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild
        script: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/ApprendreJaponais.xcworkspace" \
            --scheme "ApprendreJaponais" \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
